global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rag-assistant
    metrics_path: /metrics
    static_configs:
      # "rag" resolves when run alongside docker-compose.yml.
      # host.docker.internal covers a bare-metal app with dockerized monitoring.
      - targets: ["rag:8000"]
        labels: {instance: "docker"}
      - targets: ["host.docker.internal:8000"]
        labels: {instance: "host"}
